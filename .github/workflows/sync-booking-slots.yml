name: Sync booking slots JSON

# 【2026-08-22】5分ごとの定期実行を停止した。
# この JSON は日程調整カレンダーの「初回表示を速くするためのキャッシュ」でしかなく、
# 古い/無い場合は thanks-booking-bootstrap.js が GAS へ JSONP で直接取りに行く
# （dkBookingSlotsFetch のフォールバック）。つまり同期を止めてもカレンダーは動く。
# 一方でカレンダー動線自体は denkikouji系ではLINE一本化で撤去済み、残るは
# nenshu-shindan-v2/thanks のみで、そちらも運用上は使っていない（オーナー確認済み 2026-08-22）。
# 使われていない機能のために1日数百回Xserverへ SSH し、そのたびに一時的な到達不能で
# CI失敗メールを飛ばしていたため、定期実行をやめて手動実行だけ残す。
# 本番の booking-slots.json は deploy.yml が毎回のデプロイで生成・配信するので、
# 手動実行が必要になる場面はほぼない。カレンダーを本格的に再開するなら schedule を戻す。
on:
  workflow_dispatch:

concurrency:
  group: sync-booking-slots
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
      XSERVER_PORT: ${{ secrets.XSERVER_PORT }}
      XSERVER_USER: ${{ secrets.XSERVER_USER }}
      XSERVER_DEPLOY_PATH: ${{ secrets.XSERVER_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch slots from GAS
        run: node scripts/sync-booking-slots.js

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "$SSH_KEY" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

      - name: Trust Xserver host key
        id: hostkey
        continue-on-error: true
        run: |
          set -euo pipefail
          touch "${HOME}/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -p "$XSERVER_PORT" -H "$XSERVER_HOST" >> "${HOME}/.ssh/known_hosts" 2>/dev/null; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Upload booking-slots.json only
        env:
          HOSTKEY_OK: ${{ steps.hostkey.outputs.ok }}
        run: |
          set -euo pipefail
          if [ "${HOSTKEY_OK:-false}" = "true" ]; then
            SSH_CHECK="-o StrictHostKeyChecking=yes"
          else
            SSH_CHECK="-o StrictHostKeyChecking=accept-new"
          fi
          # XserverへのSSHは数分まるごと到達不能になることがある（2026-08-19 / 2026-08-22）。
          # 障害窓が5分前後あり30秒等間隔ではまたげないため、60s → 120s と広げて再試行する。
          attempt=0
          for wait in 60 120 ""; do
            attempt=$((attempt + 1))
            if scp -P "${XSERVER_PORT}" -i "${HOME}/.ssh/id_ed25519" ${SSH_CHECK} \
              -o ConnectTimeout=30 \
              assets/data/booking-slots.json \
              "${XSERVER_USER}@${XSERVER_HOST}:${XSERVER_DEPLOY_PATH}/assets/data/booking-slots.json"; then
              exit 0
            fi
            if [ -n "$wait" ]; then
              echo "scp attempt ${attempt} failed; retrying in ${wait}s"
              sleep "$wait"
            fi
          done
          echo "::error::scp failed after ${attempt} attempts"
          exit 1

      - name: Verify JSON on server
        run: |
          curl -sS "https://denkilp.builders-job.com/denki-lp-cvr/assets/data/booking-slots.json" | head -c 120
