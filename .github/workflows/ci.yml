name: CI

# 作業ブランチ / PR の時点で壊れを見つけるための検証。
#
# これまで静的チェックは deploy.yml（main・staging への push）の中でしか動いておらず、
# 作業ブランチでは何も回っていなかった。壊れに気づくのが「main へマージした後」だと、
# 直すのに本番デプロイをもう1回まわすことになる。ここで前倒しする。
#
# 本番/STGへは一切触らない（ネットワークも本番へは出さない）。
on:
  pull_request:
  push:
    branches-ignore: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静的チェック（禁止コピー・クマ・参照・?v=・フォーム配線）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ワークフロー内シェルの構文（run ブロックを bash -n）
        run: python3 scripts/check-workflow-shell.py

      - name: 禁止コピー / ラベル接頭辞
        run: node scripts/check-banned-copy.mjs

      - name: クマ初期位置（CSS）
        run: node scripts/check-kuma-anchor.mjs

      - name: フォーム配線（スクロール・自己修復・クマ移動・ミラー・アプリ内ブラウザ余白）
        run: node scripts/check-form-invariants.mjs

      - name: 入力欄の属性（数字キーボード・自動入力）
        run: node scripts/check-input-attrs.mjs
      - name: FAQと構造化データの一致
        run: node scripts/check-faq-schema.mjs

      - name: キャッシュバスター ?v= の整合
        run: node scripts/check-asset-versions.mjs

      - name: 遅延ステップのパス解決
        run: node scripts/check-lazy-steps.mjs

      - name: 相対参照の解決（srcset含む）
        run: node scripts/check-local-refs.mjs

      - name: LPガード
        run: node scripts/check-lp-guard.js

      - name: denkikouji リリース静的チェック
        run: node scripts/check-denkikouji-release.mjs

      - name: thanks-v2 リリース静的チェック
        run: node scripts/check-thanks-v2-release.mjs

      - name: LP→GAS ブリッジ
        run: node scripts/check-lp-bridge-release.mjs

      - name: 代理店共有シートのPII混入検査
        run: node scripts/check-agency-share.mjs

      - name: Zoho項目の長さガード（商談が作られず消えるのを防ぐ）
        run: node scripts/check-zoho-field-limits.mjs

      - name: 送信行の行番号すり替わり防止（状態列を別人に書かない）
        run: node scripts/check-gas-row-integrity.mjs

      - name: FV主画像のモバイル出し分け（PC用の重い方を配らない）
        run: node scripts/check-fv-images.mjs

  generated:
    name: 生成物のドリフト（生成スクリプトを流して差分が出ないこと）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成・同期スクリプトを実行
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund purgecss@7.0.2
          node scripts/build-theme-lp-css.mjs
          node scripts/sync-lp-canonical-urls.mjs
          node scripts/generate-wp-redirects-fragment.mjs
          node scripts/build-thanks-v2-deferred.mjs
          node scripts/build-thanks-job-previews-family.mjs
          node scripts/sync-thanks-v2-mirrors.mjs
          node scripts/generate-lp-thanks-redirects.mjs
          python3 scripts/generate-sekoukanri-variants.py

      - name: コミット済みの内容と一致するか
        run: |
          if ! git diff --quiet; then
            echo "::error::生成スクリプトの出力がコミット内容と食い違う（手編集が次の再生成で消える）"
            git --no-pager diff --stat
            exit 1
          fi
          echo "生成物のドリフトなし"

  e2e:
    name: LPフォームのローカルE2E（実ブラウザ・${{ matrix.shard }}/4）
    # 主要LPは「push のたび」に実ブラウザで通す。PRなら全50本。
    # 当初 push では丸ごと skip していたが、PRを作らずブランチへ push する運用だと
    # 実ブラウザ検証が一度も回らないという穴になっていた（2026-08-23 に発覚）。
    runs-on: ubuntu-latest
    # スクリプトはLPを**直列**に回すので、PRモードの63本は1ジョブだと55分超かかる
    # （run #172 が25分、run #174 が60分の timeout で打ち切られた実績）。
    # 検査内容は1件も減らさず、LPリストを4分割して並列に流す。
    # 分割は awk 'NR % 4 == shard % 4' で、和集合が元のリストと完全一致することを確認済み。
    # fail-fast: false ＝ どこかが落ちても他シャードの結果まで見たい。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Chromium 本体を毎ラン落とし直していた（約100MB）。バージョン文字列をキーに
      # キャッシュする。外れても従来どおり取得するだけなので、失敗しても害はない。
      - name: Playwright ブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}

      - name: Playwright（Chromiumのみ）
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: フォーム通し・自己修復・遅延ステップ復旧・load前クリック
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # 広告の着地になる主要LPだけ（数分）。壊れたら即わかる
            LPS_ALL=$(printf '%s\n' /denkikouji/ /sekoukanri/ /denkisekou/ \
                        /denkikouji-v2/ /sekoukanri-v2/ /sekoukanri-kentiku-v2/)
          else
            # PRではフォームを持つLPを全部通す。
            # 入力欄が steps-lazy.html 側にあるLP（denkikouji / sekoukanri など主力を含む10本）は
            # index.html に your-tel が無いため、この列挙から漏れていた（2026-08-23 発覚）。
            # index.html と隣の steps-lazy.html の**どちらか**に your-tel があれば対象にする。
            LPS_ALL=$(grep -rl 'name="your-tel"' --include=index.html --include=steps-lazy.html . \
                  | sed 's|^\./||; s|/[^/]*\.html$||; s|^|/|; s|$|/|' | sort -u)
          fi
          # このシャードの担当分だけ取り出す（全シャードの和集合＝元のリスト）
          LPS=$(printf '%s\n' "$LPS_ALL" | awk -v s="${{ matrix.shard }}" 'NR % 4 == s % 4')
          if [ -z "$LPS" ]; then
            echo "シャード ${{ matrix.shard }}/4 は対象LPなし（総数がシャード数より少ない）"
            exit 0
          fi
          echo "シャード ${{ matrix.shard }}/4 の対象: $(printf '%s\n' "$LPS" | wc -l) 本"
          printf '%s\n' "$LPS" | tr '\n' ' '; echo
          node scripts/e2e-lp-flow-local.mjs --lp $LPS
