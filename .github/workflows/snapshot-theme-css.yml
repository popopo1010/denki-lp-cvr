name: Snapshot WP theme CSS

# WPテーマ style.css はリポジトリ外にあり、ローカル/CI から取得できない（WAFが非ブラウザIPを403）。
# 一方 GitHub Actions ランナーからは取得できる（deploy.yml の Verify deployment で実証済み）ため、
# 本番の style.css を assets/css/theme-snapshot.css としてスナップショットし、差分があればPRを作る。
# 目的: テーマCSSをリポジトリ管理下に置き、ローカル/Playwrightテストを本番と同じCSSで走らせる。
# 2026-08-23 以降、**全LPがこのスナップショットを読む**（本番URL直参照は廃止）。
# つまりこのPRのマージが、テーマ変更をLPへ反映する唯一の経路であり、同時に見た目が変わる瞬間。
# （2026-07-08 FV非表示インシデントの再発防止。経緯: docs/release-incidents.md）。

on:
  workflow_dispatch:
  # GitHub App経由ではworkflow_dispatchが403のため、snapshot-nowブランチへのpushでも起動できる
  push:
    branches: [snapshot-now]
  schedule:
    - cron: '0 21 * * 1' # 毎週月曜 6:00 JST

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch theme CSS from production
        run: |
          set -euo pipefail
          # Xserverが数分単位で接続を弾くことがある（2026-08-17は約10分の接続不能で週次分が失敗）。
          # 3ラウンド×(curl内リトライ3回)を120秒間隔で回し、10分超の断続にも耐える。
          ok=false
          for round in 1 2 3; do
            if curl -fsS --retry 3 --retry-delay 10 --connect-timeout 20 \
              "https://denkilp.builders-job.com/wp-content/themes/original-thema/assets/css/style.css?date=20241014" \
              -o assets/css/theme-snapshot.css; then
              ok=true
              break
            fi
            echo "fetch round ${round} failed; retrying in 120s"
            sleep 120
          done
          [ "$ok" = "true" ] || { echo "::error::could not fetch theme css"; exit 1; }
          # サニティチェック: 小さすぎる・HTMLエラーページなら失敗させる
          size=$(wc -c < assets/css/theme-snapshot.css)
          [ "$size" -gt 10000 ] || { echo "::error::theme css too small (${size} bytes)"; exit 1; }
          if head -c 300 assets/css/theme-snapshot.css | grep -qi '<html'; then
            echo "::error::got HTML instead of CSS"; exit 1
          fi
          echo "fetched ${size} bytes"

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add assets/css/theme-snapshot.css
          if git diff --cached --quiet; then
            echo "No changes in theme CSS"; exit 0
          fi
          BR="theme-css-snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git commit -m "WPテーマstyle.cssスナップショット更新（自動）"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "WPテーマCSSスナップショット更新" \
            --body "本番の style.css との差分を検知しました。**このPRのマージ＝全LPの見た目が変わる**ので、差分を必ず確認してください。2026-08-23 に全LPが本番URL直参照から theme-snapshot.css に切り替わったため、テーマ変更はこのPRを通してのみLPへ反映されます（以前の『LP表示への影響はありません』は無効）。マージ＝本番デプロイ起動。表示に関わるので STG実機確認を挟んでください。" \\
            || echo "PR already exists (updated by force-push)"
